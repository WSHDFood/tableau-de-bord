name: Mise à jour du tableau de bord

on:
  schedule:
    - cron: "23 4 * * *" # chaque matin, vers 6 h 23 à Paris en été (5 h 23 en hiver)
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tableau-de-bord
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collecter les données
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_PASSWORD_PREVIOUS: ${{ secrets.DASHBOARD_PASSWORD_PREVIOUS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: node collect/index.js

      - name: Enregistrer l'historique
        run: |
          git config user.name "Mise à jour automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.enc.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer."
            exit 0
          fi
          git commit -m "Données du $(date -u +%F)"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier le site
        id: deploiement
        uses: actions/deploy-pages@v4
